<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrifarma - Historial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="Logo Nutrifarma" class="logo">
        <span>NUTRIFARMA</span>
      </div>

      <div class="profile-icon">👤</div>
    </header>

    <main class="main-content">
      <h1 class="page-title">Historial</h1>

      <section class="history-section">
        <div class="history-card">
          <div class="history-info">
            <h2>@EmilianoBA</h2>
            <p>ingresó 3 paracetamol</p>
            <p>a las 3:30 p.m.</p>
            <span>martes, 26 de febrero</span>
          </div>

          <div class="history-action add-action">
            <span class="action-icon">+</span>
            <span>+3 Paracetamol</span>
          </div>
        </div>

        <div class="history-card">
          <div class="history-info">
            <h2>@IvannaAC</h2>
            <p>quitó 4 aspirinas</p>
            <p>a las 6:00 p.m.</p>
            <span>martes, 5 de marzo</span>
          </div>

          <div class="history-action remove-action">
            <span class="action-icon">−</span>
            <span>-4 Aspirinas</span>
          </div>
        </div>
      </section>
    </main>

    <footer class="bottom-nav">
      <a href="#" class="nav-item">📦 Inventario</a>
      <a href="#" class="nav-item">📊 Estadística</a>
      <a href="#" class="nav-item active">🕓 Historial</a>
    </footer>

  </div>
</body>
</html>
