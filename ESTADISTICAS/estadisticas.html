<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrifarma - Estadística</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="Logo Nutrifarma" class="logo">
        <span>NUTRIFARMA</span>
      </div>

      <div class="profile-icon">👤</div>
    </header>

    <main class="main-content">
      <h1 class="page-title">Estadística</h1>

      <div class="filter-bar">
        <button class="filter-button">⚲</button>
        <span class="filter-text">Antiinflamatorio</span>
        <span class="filter-arrow">▼</span>
      </div>

      <section class="charts-section">
        <div class="chart-card">
          <h2>farmacias del Ahorro</h2>

          <div class="chart-area">
            <div class="grid-line line-1"></div>
            <div class="grid-line line-2"></div>
            <div class="grid-line line-3"></div>
            <div class="grid-line line-4"></div>

            <div class="bars">
              <div class="bar" style="height: 70px;"></div>
              <div class="bar" style="height: 105px;"></div>
              <div class="bar" style="height: 135px;"></div>
              <div class="bar" style="height: 160px;"></div>
              <div class="bar" style="height: 190px;"></div>
            </div>

            <div class="x-labels">
              <span>10</span>
              <span>20</span>
              <span>30</span>
              <span>35</span>
              <span>50</span>
            </div>
          </div>

          <div class="pharmacy-label">
            <span class="pharmacy-logo ahorro-logo">A</span>
            <span>farmacias del Ahorro</span>
          </div>
        </div>

        <div class="chart-card">
          <h2>farmacia Guadalajara</h2>

          <div class="chart-area">
            <div class="grid-line line-1"></div>
            <div class="grid-line line-2"></div>
            <div class="grid-line line-3"></div>
            <div class="grid-line line-4"></div>

            <div class="bars">
              <div class="bar" style="height: 85px;"></div>
              <div class="bar" style="height: 120px;"></div>
              <div class="bar" style="height: 145px;"></div>
              <div class="bar" style="height: 170px;"></div>
              <div class="bar" style="height: 195px;"></div>
            </div>

            <div class="x-labels">
              <span>15</span>
              <span>25</span>
              <span>40</span>
              <span>50</span>
              <span>55</span>
            </div>
          </div>

          <div class="pharmacy-label">
            <span class="pharmacy-logo guada-logo">✚</span>
            <span>farmacia Guadalajara</span>
          </div>
        </div>
      </section>
    </main>

    <footer class="bottom-nav">
      <a href="#" class="nav-item">📦 Inventario</a>
      <a href="#" class="nav-item active">📊 Estadística</a>
      <a href="#" class="nav-item">🕓 Historial</a>
    </footer>

  </div>
</body>
</html>
